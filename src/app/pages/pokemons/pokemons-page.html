<div class="flex flex-col items-center md:items-start gap-1 my-8 max-w-7xl mx-auto px-4">
  <span class="text-xs font-bold tracking-widest uppercase text-indigo-400">Database Index</span>
  <h1 class="text-3xl font-black text-white tracking-tight">
    Listado de Pokémons - Página: <span class="bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">#{{ currentPage() }}</span>
  </h1>
</div>

<hr class="my-2">
<div class="relative max-w-md mx-auto my-8 px-4">
  <div class="absolute inset-y-0 start-0 flex items-center ps-8 pointer-events-none text-slate-400">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
  </div>
  <input type="text"
         class="w-full ps-11 pe-4 py-3 text-sm bg-slate-900/40 backdrop-blur-md border border-slate-800 focus:border-cyan-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 text-white transition-all placeholder-slate-500"
         placeholder="Buscar Pokémon por nombre o ID..." (input)="onSearchChange($event)">
</div>


@if(pokemons().length!==0){
  <pokemon-list [pokemons]="filteredPokemons()"/>
}@else {
  <pokemon-list-skeleton/>
}

<!-- buttons cargar siguiente y anteriores-->
<div class="flex justify-between items-center max-w-7xl mx-auto px-4 mt-8 pb-12">

  <button
    [disabled]="currentPage() === 1"
    [routerLink]="['/pokemons/page', currentPage()! - 1]"
    class="flex items-center gap-2 px-5 py-2.5 text-sm font-bold tracking-wide uppercase rounded-xl border transition-all duration-300 disabled:opacity-30 disabled:pointer-events-none bg-slate-900/40 backdrop-blur-md border-slate-800 text-slate-400 hover:text-white hover:border-cyan-500/40 hover:shadow-[0_0_15px_rgba(34,211,238,0.1)]"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
    </svg>
    Anteriores
  </button>


  <button
    [routerLink]="['/pokemons/page', currentPage()! + 1]"
    class="flex items-center gap-2 px-5 py-2.5 text-sm font-bold tracking-wide uppercase rounded-xl border transition-all duration-300 bg-slate-900/40 backdrop-blur-md border-slate-800 text-slate-400 hover:text-white hover:border-cyan-500/40 hover:shadow-[0_0_15px_rgba(34,211,238,0.1)]"
  >
    Siguientes
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

</div>
