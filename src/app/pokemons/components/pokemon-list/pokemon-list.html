

<div class="grid gap-4 grid-cols-1 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 max-w-7xl mx-auto px-4 pb-12">

  @for(pokemon of pokemons(); track pokemon.id) {
    <pokemon-card [pokemon]="pokemon"/>
  } @empty {
    <div class="col-span-full text-center bg-slate-900/20 backdrop-blur-sm border border-dashed border-slate-800 rounded-2xl h-40 flex flex-col justify-center items-center gap-2 p-6">
      <svg class="w-8 h-8 text-slate-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <p class="text-sm font-medium text-slate-500">No se encontraron Pokémons en los registros.</p>
    </div>
  }

</div>
