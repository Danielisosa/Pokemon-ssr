<div
  [routerLink]="['/pokemons', pokemon().name]"
  class="group relative bg-slate-900/40 backdrop-blur-md border border-slate-800/60 rounded-2xl p-5 flex flex-col items-center justify-between min-h-[230px] transition-all duration-300 ease-out hover:-translate-y-2 hover:border-cyan-500/50 hover:shadow-[0_0_30px_rgba(34,211,238,0.15)] overflow-hidden cursor-pointer"
>

  <div class="absolute -top-10 -right-10 w-24 h-24 bg-indigo-500/10 blur-2xl rounded-full transition-all duration-300 group-hover:bg-cyan-500/20 group-hover:scale-150"></div>

  <span class="absolute top-3 left-4 text-xs font-mono font-bold text-slate-600/70 group-hover:text-cyan-400/50 transition-colors duration-300">
    #{{ pokemon().id.toString().padStart(3, '0') }}
  </span>

  <div class="relative z-10 w-full mt-4 h-32 flex items-center justify-center bg-slate-950/20 rounded-xl border border-slate-800/40 group-hover:border-cyan-500/20 transition-all duration-300">
    <img
      [src]="pokemonImage()"
      [alt]="pokemon().name"
      class="w-24 h-24 object-contain transition-transform duration-300 group-hover:scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.15)] group-hover:drop-shadow-[0_0_16px_rgba(34,211,238,0.4)]"
    />
  </div>

  <h2 class="relative z-10 mt-4 text-base font-black tracking-wide text-slate-300 uppercase group-hover:text-white transition-colors duration-200">
    {{ pokemon().name }}
  </h2>

</div>
